services:
  relay:
    build: .
    ports:
      - "127.0.0.1:47831:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CALLER_CLOUD_TOKEN: ${CALLER_CLOUD_TOKEN-${RINGER_CLOUD_TOKEN:-}}
      CALLER_SIP_URL: ${CALLER_SIP_URL-${RINGER_SIP_URL:-}}
      CALLER_SIP_USERNAME: ${CALLER_SIP_USERNAME-${RINGER_SIP_USERNAME:-}}
      CALLER_SIP_PASSWORD: ${CALLER_SIP_PASSWORD-${RINGER_SIP_PASSWORD:-}}
      CALLER_NUMBER: ${CALLER_NUMBER-${RINGER_CALLER_NUMBER:-}}
      CALLER_ALTERNATE_NUMBER: ${CALLER_ALTERNATE_NUMBER-${RINGER_ALTERNATE_CALLER_NUMBER:-}}
      CALLER_ALLOWED_DIAL_PREFIXES: ${CALLER_ALLOWED_DIAL_PREFIXES-${RINGER_ALLOWED_DIAL_PREFIXES:-}}
      CALLER_TELEGRAM_ORIGIN: http://telegram:8090
      CALLER_TELEGRAM_TOKEN: ${CALLER_TELEGRAM_TOKEN-${RINGER_TELEGRAM_TOKEN:-}}
      CALLER_TELEGRAM_CALLS: ${CALLER_TELEGRAM_CALLS-${RINGER_TELEGRAM_CALLS:-0}}
      CALLER_TELEGRAM_MESSAGING: ${CALLER_TELEGRAM_MESSAGING-${RINGER_TELEGRAM_MESSAGING:-0}}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  telegram:
    profiles: [telegram]
    build: ./telegram
    environment:
      CALLER_TELEGRAM_TOKEN: ${CALLER_TELEGRAM_TOKEN-${RINGER_TELEGRAM_TOKEN:-}}
      CALLER_TELEGRAM_CALLS: ${CALLER_TELEGRAM_CALLS-${RINGER_TELEGRAM_CALLS:-0}}
      CALLER_TELEGRAM_MESSAGING: ${CALLER_TELEGRAM_MESSAGING-${RINGER_TELEGRAM_MESSAGING:-0}}
    volumes:
      - telegram-state:/state
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  telegram-state:
